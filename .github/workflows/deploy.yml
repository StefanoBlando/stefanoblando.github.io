name: Deploy website to GitHub Pages

on:
  # Every push to `main` is a deployment. This is the only one — there is no
  # second host, and no staging environment.
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Runs before the build on purpose: these cover the résumé generator, the
      # interface dictionary and the citation data, so a missing translation or
      # a malformed author file fails here rather than shipping.
      - name: Test
        run: npm test

      # `npm run build` is three steps: the generators that write src/data,
      # `astro build` into dist/, then the Pagefind index inside dist/.
      # The canonical host comes from astro.config.mjs, not from this file.
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
