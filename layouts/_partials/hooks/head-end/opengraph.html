{{/* OpenGraph & Twitter Social Card Meta Tags */}}
<meta property="og:site_name" content="Stefano Blando | PhD Researcher in AI & Economics" />
<meta property="og:title" content="{{ with .Title }}{{ . }} | Stefano Blando{{ else }}Stefano Blando — PhD Researcher in AI & Economics{{ end }}" />
<meta property="og:description" content="{{ with .Params.summary }}{{ . }}{{ else }}{{ with .Description }}{{ . }}{{ else }}Stefano Blando is a PhD student in Artificial Intelligence at Scuola Superiore Sant'Anna & University of Pisa, studying adaptive multi-agent systems, statistical verification, and robust financial quantitative methods.{{ end }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />

{{- $ogImage := "media/icon.png" | absURL -}}
{{- with .Resources.GetMatch "featured*" -}}
  {{- $ogImage = .RelPermalink | absURL -}}
{{- end -}}

<meta property="og:image" content="{{ $ogImage }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ with .Title }}{{ . }} | Stefano Blando{{ else }}Stefano Blando — PhD Researcher in AI & Economics{{ end }}" />
<meta name="twitter:description" content="{{ with .Params.summary }}{{ . }}{{ else }}Stefano Blando is a PhD student in Artificial Intelligence at Scuola Superiore Sant'Anna & University of Pisa.{{ end }}" />
<meta name="twitter:image" content="{{ $ogImage }}" />
