{{ $block := .wcBlock }}
<section id="contact" class="portfolio-contact portfolio-section" aria-labelledby="contact-title">
  <div class="portfolio-contact__inner" data-reveal>
    <p class="portfolio-eyebrow">{{ $block.content.eyebrow }}</p>
    <h2 id="contact-title">{{ $block.content.title }}</h2>
    <p class="portfolio-contact__text">{{ $block.content.text }}</p>
    <div class="portfolio-contact__email-wrapper">
      <a class="portfolio-contact__email" href="mailto:{{ $block.content.email }}">{{ $block.content.email }}</a>
      <button type="button" class="portfolio-copy-btn portfolio-copy-btn--contact" data-copy="{{ $block.content.email }}" aria-label="Copy email address" title="Copy email">
        <span class="portfolio-copy-btn__icon" aria-hidden="true">
          <svg class="portfolio-copy-icon--default" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <svg class="portfolio-copy-icon--success" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span class="portfolio-copy-btn__label">Copy</span>
      </button>
    </div>
    <div class="portfolio-contact__links">
      {{ range $block.content.links }}
        <a href="{{ .url }}"{{ if strings.HasPrefix .url "http" }} rel="noopener"{{ end }}>{{ .label }}</a>
      {{ end }}
    </div>
  </div>
</section>
